name: benchmark

on:
  workflow_call: {}
  workflow_dispatch: {}

jobs:
  benchmark:
    runs-on: "ubuntu-latest"
    env:
      GOMAXPROCS: 4
      CPU_OUT: cpu.pprof
      MEM_OUT: mem.pprof
    steps:
      - uses: actions/checkout@v6
      - uses: projectdiscovery/actions/setup/go@v1
        with:
          go-version: "stable"
      - run: go install golang.org/x/perf/cmd/benchstat@latest
      - run: make bench CPU_OUT=${{ env.CPU_OUT }} MEM_OUT=${{ env.MEM_OUT }}
        working-directory: ./benchmarks
      - run: benchstat richglob doublestar std
        working-directory: ./benchmarks/out
      - uses: actions/upload-artifact@v7
        with:
          name: profiles
          path: |
            benchmarks/cpu.pprof
            benchmarks/mem.pprof
